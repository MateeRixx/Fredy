# Render blueprint — one-click deployment
# Deploy from GitHub: https://render.com → New → Blueprint → pick this repo
# Free tier: 512MB RAM, sleeps on idle (cold start ~30-60s on first visit).
services:
  - type: web
    name: fraud-command
    runtime: docker
    plan: free
    dockerfilePath: docker/production.Dockerfile
    autoDeploy: true
    healthCheckPath: /api/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO